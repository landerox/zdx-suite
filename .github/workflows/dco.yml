name: PR · DCO Check
run-name: >-
  DCO Check · ${{ github.event.pull_request.title }}

on:
    pull_request:
        branches:
            - main

permissions:
    contents: read
    pull-requests: read

jobs:
    dco:
        name: DCO
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0
                  persist-credentials: false

            - name: Get PR commits
              id: get-pr-commits
              uses: tim-actions/get-pr-commits@198af03565609bb4ed924d1260247b4881f09e7d # v1.3.1
              with:
                  token: ${{ secrets.GITHUB_TOKEN }}

            - name: Check DCO sign-off
              if: github.event.pull_request.user.login != 'dependabot[bot]'
              uses: tim-actions/dco@f2279e6e62d5a7d9115b0cb8e837b777b1b02e21 # v1.1.0
              with:
                  commits: ${{ steps.get-pr-commits.outputs.commits }}

            # Dependabot cannot add a sign-off. Its pull requests pass only when
            # every commit is authored by Dependabot and verified by GitHub; a
            # commit pushed by anyone else fails here and needs its own PR.
            - name: Confirm a Dependabot pull request holds only Dependabot commits
              if: github.event.pull_request.user.login == 'dependabot[bot]'
              env:
                  PR_COMMITS: ${{ steps.get-pr-commits.outputs.commits }}
              run: |
                  jq -e 'length > 0 and all(.[];
                      .author.login == "dependabot[bot]"
                      and .commit.verification.verified == true)' \
                      <<<"$PR_COMMITS" >/dev/null
