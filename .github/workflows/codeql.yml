name: Security · CodeQL
run-name: >-
  CodeQL · ${{
    github.event_name == 'pull_request' && github.event.pull_request.title
    || github.event_name == 'push' && github.event.head_commit.message
    || github.event_name == 'workflow_dispatch' && 'manual dispatch'
    || github.ref_name
  }}

on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main
    schedule:
        # Mondays 09:30 UTC (same as Scorecard).
        - cron: "30 9 * * 1"
    workflow_dispatch:

permissions: read-all

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    analyze:
        name: CodeQL
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            actions: read
            contents: read
            security-events: write

        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Initialize CodeQL
              uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
              with:
                  languages: python
                  build-mode: none

            - name: Perform CodeQL Analysis
              uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
