name: CI · Quality Gates
run-name: >-
  Quality Gates · ${{
    github.event_name == 'pull_request' && github.event.pull_request.title
    || github.event_name == 'workflow_dispatch' && 'manual dispatch'
    || github.ref_name
  }}

on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main
    workflow_dispatch:
    schedule:
        # Daily at 08:00 UTC — catches CVEs published while the repo is idle.
        - cron: "0 8 * * *"

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    lint:
        name: lint
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Install uv
              uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
              with:
                  version: "0.12.6"
                  enable-cache: true

            - name: Install local gate system dependencies
              run: |
                  sudo apt-get update
                  sudo apt-get install -y bats fzf just zsh

            - name: Install dependencies
              run: uv sync --locked

            - name: Run local quality gate
              run: just check
